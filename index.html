<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBIS RICE Operations Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #141c2f;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
      color: #10b981;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #10b981;
      color: #0b0f19;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #059669;
    }
    .secondary-link {
      margin-top: 20px;
      display: block;
      color: #64748b;
      font-size: 12px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌾</div>
    <h1>IBIS RICE Operations Portal</h1>
    <p>The Next.js 14 production web application is running locally. Access the multi-role Field, Warehouse, and Finance portals below.</p>
    <a href="http://localhost:3000" class="btn">🚀 Open Next.js App (http://localhost:3000)</a>
    <a href="paddy_purchase_invoice.html" class="secondary-link">View Legacy HTML Prototype</a>
  </div>
</body>
</html>
